name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # Дымовой тест без ключа: скрипт должен отработать на запасных правилах
      - run: python -m app.cli messages.txt --offline --no-save

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8000/api/health
      - run: docker compose exec -T app python -m app.cli messages.txt
